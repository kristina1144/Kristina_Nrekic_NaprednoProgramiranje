name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  provjere:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v7
      - name: Podesi Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Instaliraj zavisnosti
        run: python -m pip install -r requirements.txt
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy main.py
      - name: Pytest
        run: python -m pytest -q
      - name: Bandit
        run: bandit -q main.py
      - name: Pip audit
        run: pip-audit -r requirements.txt
